<!DOCTYPE html>
<html lang="en" data-theme="shadcn"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <!--/*@thymesVar id="title" type="java.lang.String"*/-->
  <title th:text="${title} ?: 'Contacts'">Contacts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}"/>
  <link rel="stylesheet" th:href="@{/css/output.css}"/>
  <script src="https://unpkg.com/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.8/dist/cdn.min.js" defer></script>
</head>
<body class="bg-zinc-50 min-h-screen text-zinc-900 antialiased">

<header class="sticky top-0 z-50 bg-white border-b border-zinc-200">
  <div class="max-w-5xl mx-auto px-6 h-14 flex items-center gap-4">
    <a th:href="@{/contacts}" class="flex items-center gap-2.5 shrink-0">
      <div class="w-6 h-6 bg-zinc-900 rounded flex items-center justify-center">
        <i data-lucide="contact-round" class="w-3.5 h-3.5 text-white"></i>
      </div>
      <span class="text-sm font-semibold tracking-tight text-zinc-900">Contacts</span>
    </a>
    <form th:action="@{/contacts}" method="get" class="flex-1 max-w-sm">
      <div class="relative">
        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-zinc-400 pointer-events-none"></i>
        <label for="nav-search" class="sr-only">Search contacts</label>
        <input id="nav-search" name="q"
               th:placeholder="${contactPage != null ? 'Search ' + contactPage.totalElements + ' contacts...' : 'Search contacts...'}"
               th:value="${search} ?: ''"
               type="search"
               class="w-full h-8 pl-9 pr-3 text-sm bg-zinc-50 border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:border-transparent placeholder:text-zinc-400"/>
      </div>
    </form>
    <a th:href="@{/contacts/new}" class="btn btn-primary btn-sm gap-1.5 shrink-0 ml-auto">
      <i data-lucide="plus" class="w-3.5 h-3.5"></i>
      New Contact
    </a>
  </div>
</header>

<main class="max-w-5xl mx-auto px-6 py-8">
  <div layout:fragment="content"></div>
</main>

<script>
  lucide.createIcons();
  document.addEventListener('htmx:afterSettle', (e) => lucide.createIcons({ root: e.detail.elt }));
</script>
</body>
</html>
