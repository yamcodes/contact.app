<!DOCTYPE html>
<html lang="en" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <title>Not Found</title>
</head>
<body>
<div layout:fragment="content">
  <div class="max-w-md mx-auto mt-16 text-center">
    <p class="text-7xl font-bold text-base-content/10 mb-2 select-none">404</p>
    <h1 class="text-lg font-semibold text-base-content mb-1">Page not found</h1>
    <p class="text-sm text-base-content/50 mb-6">The page you were looking for doesn't exist.</p>
    <a th:href="@{/contacts}" class="btn btn-primary btn-sm gap-1.5">
      Back to contacts
    </a>
  </div>
</div>
</body>
</html>
