<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*@thymesVar id="contact" type="codes.yam.contacts.Contact"*/-->
<div th:fragment="contact-fields" th:object="${contact}">
    <label for="first">First</label>
    <input id="first" name="first" th:value="*{first}" type="text"/>
    <span th:if="${#fields.hasErrors('first')}" th:errors="*{first}"></span>

    <label for="last">Last</label>
    <input id="last" name="last" th:value="*{last}" type="text"/>
    <span th:if="${#fields.hasErrors('last')}" th:errors="*{last}"></span>

    <label for="phone">Phone</label>
    <input id="phone" name="phone" th:value="*{phone}" type="text"/>
    <span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>

    <label for="email">Email</label>
    <input id="email" name="email" th:value="*{email}" type="email"/>
    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
</div>
</body>
</html>
