<!--suppress HtmlFormInputWithoutLabel, XmlInvalidId -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*@thymesVar id="contact" type="codes.yam.contacts.Contact"*/-->
<fieldset th:fragment="contact-fields" th:object="${contact}" class="contents">
  <div class="grid grid-cols-2 gap-4">

    <div class="flex flex-col gap-1.5">
      <label for="first" class="text-sm font-medium text-zinc-700">First Name</label>
      <input placeholder="First Name"
             th:field="*{first}"
             type="text"
             class="h-9 px-3 text-sm bg-white border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:border-transparent placeholder:text-zinc-400"/>
      <div>
        <span class="text-xs text-red-500" th:errors="*{first}"></span>
      </div>
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="last" class="text-sm font-medium text-zinc-700">Last Name</label>
      <input placeholder="Last Name"
             th:field="*{last}"
             type="text"
             class="h-9 px-3 text-sm bg-white border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:border-transparent placeholder:text-zinc-400"/>
      <div>
        <span class="text-xs text-red-500" th:errors="*{last}"></span>
      </div>
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="email" class="text-sm font-medium text-zinc-700">Email</label>
      <input hx-target="next div" hx-trigger="change, keyup delay:200ms changed"
             placeholder="Email"
             th:with="validateUrl=@{/contacts/{slug}/email(slug=${contact.slug})}"
             th:attr="hx-get=${contact.slug != null} ? ${validateUrl} : null"
             th:field="*{email}"
             type="email"
             class="h-9 px-3 text-sm bg-white border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:border-transparent placeholder:text-zinc-400"/>
      <div>
        <span class="text-xs text-red-500" th:errors="*{email}"></span>
      </div>
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="phone" class="text-sm font-medium text-zinc-700">Phone</label>
      <input placeholder="Phone"
             th:field="*{phone}"
             type="tel"
             class="h-9 px-3 text-sm bg-white border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:border-transparent placeholder:text-zinc-400"/>
      <div>
        <span class="text-xs text-red-500" th:errors="*{phone}"></span>
      </div>
    </div>

  </div>
</fieldset>
</body>
</html>
