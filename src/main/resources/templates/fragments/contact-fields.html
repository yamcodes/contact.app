<!--suppress HtmlFormInputWithoutLabel, XmlInvalidId -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*@thymesVar id="contact" type="codes.yam.contacts.Contact"*/-->
<fieldset th:fragment="contact-fields" th:object="${contact}">
    <legend>Contact Values</legend>
    <p>
        <label for="email">Email</label>
        <input placeholder="Email" th:field="*{email}" type="email"/>
        <span class="error" th:errors="*{email}" th:if="${#fields.hasErrors('email')}"></span>
    </p>
    <p>
        <label for="first">First Name</label>
        <input placeholder="First Name" th:field="*{first}" type="text"/>
        <span class="error" th:errors="*{first}" th:if="${#fields.hasErrors('first')}"></span>
    </p>
    <p>
        <label for="last">Last Name</label>
        <input placeholder="Last Name" th:field="*{last}" type="text"/>
        <span class="error" th:errors="*{last}" th:if="${#fields.hasErrors('last')}"></span>
    </p>
    <p>
        <label for="phone">Phone</label>
        <input placeholder="Phone" th:field="*{phone}" type="tel"/>
        <span class="error" th:errors="*{phone}" th:if="${#fields.hasErrors('phone')}"></span>
    </p>
</fieldset>
</body>
</html>
