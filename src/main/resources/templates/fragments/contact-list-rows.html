<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="rows(contacts)">
  <!--/*@thymesVar id="contacts" type="java.util.List<codes.yam.contacts.Contact>"*/-->
  <!--/*@thymesVar id="contact" type="codes.yam.contacts.Contact"*/-->
  <tr th:each="contact : ${contacts}" th:object="${contact}"
      class="hover:bg-base-300 cursor-pointer"
      th:onclick="|window.location='@{/contacts/{slug}(slug=*{slug})}'|">
    <th onclick="event.stopPropagation()">
      <label>
        <input
          name="selected_contact_slugs"
          th:attr="aria-label=*{first} + ' ' + *{last}"
          th:value="*{slug}"
          type="checkbox"
          class="checkbox checkbox-sm"
        />
      </label>
    </th>
    <td>
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-zinc-100 rounded-full flex items-center justify-center text-xs font-semibold text-zinc-600 shrink-0"
             th:text="*{#strings.substring(first, 0, 1) + #strings.substring(last, 0, 1)}">AB</div>
        <div>
          <div class="font-medium text-zinc-900" th:text="*{first + ' ' + last}"></div>
          <div class="text-xs text-zinc-500" th:text="*{email}"></div>
        </div>
      </div>
    </td>
    <td class="font-mono text-xs text-zinc-500" th:text="*{phone}"></td>
    <td onclick="event.stopPropagation()">
      <div class="flex items-center justify-end gap-1">
        <a th:href="@{/contacts/{slug}/edit(slug=*{slug})}" class="btn btn-ghost btn-xs">Edit</a>
        <button type="button"
                hx-confirm="Are you sure you want to delete this contact?"
                hx-target="body"
                hx-push-url="true"
                th:attr="hx-delete=@{/contacts/{slug}(slug=*{slug})}"
                class="btn btn-ghost btn-xs text-error hover:text-error">
          Delete
        </button>
      </div>
    </td>
  </tr>
</th:block>
</body>
</html>
