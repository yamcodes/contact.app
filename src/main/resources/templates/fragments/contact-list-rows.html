<!--suppress HtmlFormInputWithoutLabel, XmlInvalidId -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="rows(contacts)">
  <!--/*@thymesVar id="contacts" type="java.util.List<codes.yam.contacts.Contact>"*/-->
  <!--/*@thymesVar id="contact" type="codes.yam.contacts.Contact"*/-->
  <tr th:each="contact : ${contacts}" th:object="${contact}"
      class="border-b border-zinc-100 last:border-0 hover:bg-zinc-50 transition-colors group">
    <td class="px-4 py-3">
      <input
        name="selected_contact_slugs"
        th:attr="aria-label=*{first} + ' ' + *{last}"
        th:value="*{slug}"
        type="checkbox"
        class="w-4 h-4 rounded border-zinc-300 text-zinc-900 focus:ring-zinc-900 focus:ring-offset-0"
      />
    </td>
    <td class="px-4 py-3 font-medium text-zinc-900" th:text="*{first}"></td>
    <td class="px-4 py-3 text-zinc-700" th:text="*{last}"></td>
    <td class="px-4 py-3 text-zinc-500 font-mono text-xs" th:text="*{phone}"></td>
    <td class="px-4 py-3 text-zinc-500" th:text="*{email}"></td>
    <td class="px-4 py-3">
      <div class="flex items-center justify-end gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
        <a th:href="@{/contacts/{slug}(slug=*{slug})}" class="btn btn-ghost btn-xs">View</a>
        <a th:href="@{/contacts/{slug}/edit(slug=*{slug})}" class="btn btn-ghost btn-xs">Edit</a>
        <button type="button"
                hx-confirm="Are you sure you want to delete this contact?"
                hx-swap="delete swap:300ms"
                hx-target="closest tr"
                th:attr="hx-delete=@{/contacts/{slug}(slug=*{slug})}"
                class="btn btn-ghost btn-xs text-error hover:text-error">
          Delete
        </button>
      </div>
    </td>
  </tr>
</th:block>
</body>
</html>
