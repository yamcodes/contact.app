<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <body>
    <th:block th:fragment="rows(contacts)">
      <!--/*@thymesVar id="contacts" type="java.util.List<codes.yam.contacts.Contact>"*/-->
      <!--/*@thymesVar id="contact" type="codes.yam.contacts.Contact"*/-->
      <!--/*@thymesVar id="search" type="java.lang.String"*/-->
      <tr th:if="${contacts.isEmpty()}">
        <td colspan="4" class="py-16 text-center">
          <div class="bg-base-200 mx-auto mb-3 flex h-10 w-10 items-center justify-center rounded-full">
            <i data-lucide="user-round" class="text-base-content/40 h-4.5 w-4.5"></i>
          </div>
          <p class="text-base-content text-sm font-medium">No contacts found</p>
          <p class="text-base-content/50 mt-1 text-sm">
            <span th:if="${!#strings.isEmpty(search)}">Try a different search term or </span>
            <a th:href="@{/contacts/new}" class="text-base-content underline underline-offset-2"
              >add your first contact</a
            >
          </p>
        </td>
      </tr>
      <tr
        th:each="contact : ${contacts}"
        th:object="${contact}"
        class="hover:bg-base-300 group/row cursor-pointer"
        th:onclick="|window.location='@{/contacts/{slug}(slug=*{slug})}'|"
      >
        <td>
          <div class="flex items-center gap-3">
            <div class="relative h-8 w-8 shrink-0 [&:has(:checked)>div]:hidden [&:has(:checked)>label]:opacity-100 [&:has(:checked)>label]:pointer-events-auto">
              <div
                class="bg-base-200 text-base-content/60 absolute inset-0 flex items-center justify-center rounded-full text-xs font-semibold group-hover/row:hidden"
                th:text="*{#strings.substring(first, 0, 1) + #strings.substring(last, 0, 1)}"
              >
                AB
              </div>
              <!--suppress JSUnresolvedReference it's fine -->
              <label
                class="absolute inset-0 flex opacity-0 pointer-events-none cursor-pointer items-center justify-center group-hover/row:opacity-100 group-hover/row:pointer-events-auto"
                @click.stop
              >
                <input
                  name="selected_contact_slugs"
                  th:attr="aria-label=*{first} + ' ' + *{last}"
                  th:value="*{slug}"
                  type="checkbox"
                  class="checkbox checkbox-sm"
                  @change="selected += $event.target.checked ? 1 : -1"
                />
              </label>
            </div>
            <div>
              <div class="text-base-content font-medium" th:text="*{first + ' ' + last}"></div>
              <div class="text-base-content/50 text-xs" th:text="*{email}"></div>
            </div>
          </div>
        </td>
        <td class="text-base-content/50 font-mono text-xs" th:text="*{phone}"></td>
        <td @click.stop>
          <div class="flex items-center justify-end gap-1 opacity-0 group-hover/row:opacity-100 actions">
            <a
              th:href="@{/contacts/{slug}/edit(slug=*{slug})}"
              th:attr="aria-label='Edit ' + *{first} + ' ' + *{last}"
              class="btn btn-ghost btn-xs"
            >
              <i data-lucide="edit-2" class="h-3 w-3"></i>
            </a>
            <button
              type="button"
              th:attr="aria-label='Delete ' + *{first} + ' ' + *{last}, hx-delete=@{/contacts/{slug}(slug=*{slug})}"
              hx-confirm="Are you sure you want to delete this contact?"
              hx-target="body"
              hx-push-url="true"
              class="btn btn-ghost btn-xs"
            >
              <i data-lucide="trash-2" class="h-3 w-3"></i>
            </button>
          </div>
        </td>
      </tr>
    </th:block>
  </body>
</html>
