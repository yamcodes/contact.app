<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="rows(contacts)">
  <!--/*@thymesVar id="contacts" type="java.util.List<codes.yam.contacts.Contact>"*/-->
  <!--/*@thymesVar id="contact" type="codes.yam.contacts.Contact"*/-->
  <!--/*@thymesVar id="search" type="java.lang.String"*/-->
  <tr th:if="${contacts.isEmpty()}">
    <td colspan="4" class="py-16 text-center">
      <div class="w-10 h-10 bg-base-200 rounded-full flex items-center justify-center mx-auto mb-3">
        <i data-lucide="user-round" class="w-4.5 h-4.5 text-base-content/40"></i>
      </div>
      <p class="text-sm font-medium text-base-content">No contacts found</p>
      <p class="text-sm text-base-content/50 mt-1">
        <span th:if="${!#strings.isEmpty(search)}">Try a different search term or </span>
        <a th:href="@{/contacts/new}" class="text-base-content underline underline-offset-2">add your first contact</a>
      </p>
    </td>
  </tr>
  <tr th:each="contact : ${contacts}" th:object="${contact}"
      class="hover:bg-base-300 cursor-pointer group"
      th:onclick="|window.location='@{/contacts/{slug}(slug=*{slug})}'|">
    <th @click.stop>
      <label>
        <!--suppress JSUnresolvedReference it's fine -->
        <input
          name="selected_contact_slugs"
          th:attr="aria-label=*{first} + ' ' + *{last}"
          th:value="*{slug}"
          type="checkbox"
          class="checkbox checkbox-sm"
          @change="selected += $event.target.checked ? 1 : -1"
        />
      </label>
    </th>
    <td>
      <div class="flex items-center gap-3">
        <div
          class="w-8 h-8 bg-base-200 rounded-full flex items-center justify-center text-xs font-semibold text-base-content/60 shrink-0"
          th:text="*{#strings.substring(first, 0, 1) + #strings.substring(last, 0, 1)}">AB
        </div>
        <div>
          <div class="font-medium text-base-content" th:text="*{first + ' ' + last}"></div>
          <div class="text-xs text-base-content/50" th:text="*{email}"></div>
        </div>
      </div>
    </td>
    <td class="font-mono text-xs text-base-content/50" th:text="*{phone}"></td>
    <td @click.stop>
      <div class="flex items-center justify-end gap-1 opacity-0 group-hover:opacity-100" id="actions">
        <a th:href="@{/contacts/{slug}/edit(slug=*{slug})}"
           th:attr="aria-label='Edit ' + *{first} + ' ' + *{last}"
           class="btn btn-ghost btn-xs">
          <i data-lucide="edit-2" class="w-3 h-3"></i>
        </a>
        <button type="button"
                th:attr="aria-label='Delete ' + *{first} + ' ' + *{last}, hx-delete=@{/contacts/{slug}(slug=*{slug})}"
                hx-confirm="Are you sure you want to delete this contact?"
                hx-target="body"
                hx-push-url="true"
                class="btn btn-ghost btn-xs">
          <i data-lucide="trash-2" class="w-3 h-3"></i>
        </button>
      </div>
    </td>
  </tr>
</th:block>
</body>
</html>
