<!DOCTYPE html>
<html lang="en" layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <title>View Contact</title>
</head>
<body>
<!--/*@thymesVar id="contact" type="codes.yam.contacts.Contact"*/-->
<div layout:fragment="content">
  <div class="max-w-xl">

    <div class="mb-6">
      <a th:href="@{/contacts}" class="inline-flex items-center gap-1.5 text-sm text-zinc-500 hover:text-zinc-900 transition-colors mb-4">
        <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
        Back to contacts
      </a>
    </div>

    <div class="bg-white border border-zinc-200 rounded-lg p-6">
      <div class="flex items-start justify-between mb-6">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-zinc-100 rounded-full flex items-center justify-center text-sm font-semibold text-zinc-600"
               th:text="${#strings.substring(contact.first, 0, 1) + #strings.substring(contact.last, 0, 1)}">AB</div>
          <div>
            <h1 class="text-lg font-semibold text-zinc-900"
                th:text="${contact.first} + ' ' + ${contact.last}"></h1>
          </div>
        </div>
        <a th:href="@{/contacts/{slug}/edit(slug=${contact.slug})}"
           class="btn btn-ghost btn-sm gap-1.5">
          <i data-lucide="pencil" class="w-3 h-3"></i>
          Edit
        </a>
      </div>

      <div class="space-y-3">
        <div class="flex items-center gap-3 py-2.5 border-b border-zinc-100">
          <span class="text-xs font-medium text-zinc-400 uppercase tracking-wide w-16">Phone</span>
          <span class="text-sm text-zinc-900 font-mono" th:text="${contact.phone}"></span>
        </div>
        <div class="flex items-center gap-3 py-2.5">
          <span class="text-xs font-medium text-zinc-400 uppercase tracking-wide w-16">Email</span>
          <a th:href="'mailto:' + ${contact.email}"
             class="text-sm text-zinc-900 hover:underline underline-offset-2"
             th:text="${contact.email}"></a>
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
