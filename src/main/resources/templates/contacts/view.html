<!doctype html>
<html
  lang="en"
  layout:decorate="~{layout}"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <title>View Contact</title>
  </head>
  <body>
    <!--/*@thymesVar id="contact" type="codes.yam.contacts.Contact"*/-->
    <div layout:fragment="content">
      <div class="max-w-xl">
        <div class="mb-6">
          <a
            th:href="@{/contacts}"
            class="text-base-content/50 hover:text-base-content mb-4 inline-flex items-center gap-1.5 text-sm transition-colors"
          >
            <i data-lucide="chevron-left" class="h-3.5 w-3.5"></i>
            Back to contacts
          </a>
        </div>

        <div class="bg-base-100 border-base-300 rounded-lg border p-6">
          <div class="mb-6 flex items-start justify-between">
            <div class="flex items-center gap-3">
              <div
                class="bg-base-200 text-base-content/60 flex h-10 w-10 items-center justify-center rounded-full text-sm font-semibold"
                th:text="${#strings.substring(contact.first, 0, 1) + #strings.substring(contact.last, 0, 1)}"
              >
                AB
              </div>
              <div>
                <h1
                  class="text-base-content text-lg font-semibold"
                  th:text="${contact.first} + ' ' + ${contact.last}"
                ></h1>
              </div>
            </div>
            <a th:href="@{/contacts/{slug}/edit(slug=${contact.slug})}" class="btn btn-ghost btn-sm gap-1.5">
              <i data-lucide="pencil" class="h-3 w-3"></i>
              Edit
            </a>
          </div>

          <div class="space-y-3">
            <div class="border-base-200 flex items-center gap-3 border-b py-2.5">
              <span class="text-base-content/40 w-16 text-xs font-medium tracking-wide uppercase">Phone</span>
              <span class="text-base-content font-mono text-sm" th:text="${contact.phone}"></span>
            </div>
            <div class="flex items-center gap-3 py-2.5">
              <span class="text-base-content/40 w-16 text-xs font-medium tracking-wide uppercase">Email</span>
              <a
                th:href="'mailto:' + ${contact.email}"
                class="text-base-content text-sm underline-offset-2 hover:underline"
                th:text="${contact.email}"
              ></a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
