<!doctype html>
<html
  lang="en"
  layout:decorate="~{layout}"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <title>Edit Contact</title>
  </head>
  <body>
    <!--/*@thymesVar id="contact" type="codes.yam.contacts.Contact"*/-->
    <div layout:fragment="content">
      <div class="max-w-xl">
        <div class="mb-6">
          <a
            th:href="@{/contacts}"
            class="text-base-content/50 hover:text-base-content mb-4 inline-flex items-center gap-1.5 text-sm transition-colors"
          >
            <i data-lucide="chevron-left" class="h-3.5 w-3.5"></i>
            Back to contacts
          </a>
          <h1 class="text-base-content text-xl font-semibold" th:text="${contact.first} + ' ' + ${contact.last}">
            Edit Contact
          </h1>
          <p class="text-base-content/50 mt-0.5 text-sm">Update contact information.</p>
        </div>

        <div class="bg-base-100 border-base-300 mb-4 rounded-lg border p-6">
          <form method="post" th:action="@{/contacts/{slug}/edit(slug=${contact.slug})}">
            <th:block th:replace="~{fragments/contact-fields::contact-fields}"></th:block>
            <div class="mt-6 flex items-center gap-3">
              <button type="submit" class="btn btn-primary btn-sm">Save Changes</button>
              <a th:href="@{/contacts}" class="btn btn-ghost btn-sm">Cancel</a>
            </div>
          </form>
        </div>

        <div class="bg-base-100 border-error/30 rounded-lg border p-4">
          <h2 class="text-base-content mb-1 text-sm font-medium">Danger Zone</h2>
          <p class="text-base-content/50 mb-3 text-xs">
            Permanently delete this contact. This action cannot be undone.
          </p>
          <button
            hx-confirm="Are you sure you want to delete this contact?"
            hx-push-url="true"
            hx-target="body"
            th:attr="hx-delete=@{/contacts/{slug}(slug=${contact.slug})}"
            class="btn btn-error btn-outline btn-sm gap-1.5"
          >
            <i data-lucide="trash-2" class="h-3 w-3"></i>
            Delete Contact
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
