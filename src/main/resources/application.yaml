spring:
  application:
    name: Contacts
  thymeleaf:
    cache: false
  devtools:
    livereload:
      enabled: true
  web:
    resources:
      static-locations:
        - file:src/main/resources/static/
        - classpath:/static/
      cache:
        period: 0
      chain:
        cache: false
  h2:
    console:
      enabled: true
  jpa:
    defer-datasource-initialization: true
  datasource:
    url: jdbc:h2:mem:contacts;DB_CLOSE_DELAY=-1