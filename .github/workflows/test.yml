name: test

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: ./mvnw -B -DskipTests package

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
      - run: ./mvnw -B test
        env:
          APP_USERNAME: ci
          APP_PASSWORD: ci
